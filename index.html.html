<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uniagro Gourmet — Agenda de Recebimento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>  .hero h1{ position: relative; display: inline-block; padding: 0 3.5rem; }
  .hero h1::before, .hero h1::after{
    content:""; position:absolute; top:auto; bottom:0.9rem;
    width: 2.5rem; height:1px; background: rgba(160,225,205,0.6);
  }
  .hero h1::before{ left:0; }
  .hero h1::after{ right:0; }
  @media (max-width: 640px){
    .hero h1{ padding: 0; }
    .hero h1::before, .hero h1::after{ display:none; }
  }
  :root{
    --verde: #1B8E77;
    --verde-escuro: #0E3B32;
    --preto: #14140F;
    --creme: #F7F4EC;
    --creme-2: #EFEADD;
    --vermelho: #B33A24;
    --dourado: #B99A5B;
    --ambar: #B4791E;
    --ambar-bg: #FBF0DD;
    --linha: rgba(20,20,15,0.12);
    --sombra: rgba(14,59,50,0.14);
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--creme);
    color: var(--preto);
    font-family: 'Manrope', sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3, .display{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
  }
  a{ color: inherit; }
  button{ font-family: inherit; cursor: pointer; }

  .config-warning{
    background: #B33A24; color:#fff; text-align:center;
    padding: 0.6rem 1rem; font-size: 0.85rem; font-weight:700;
    display:none;
  }
  .config-warning.show{ display:block; }

  /* ---------- HERO ---------- */
   .hero{
    position: relative;
    background: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.10) 1.4px, transparent 1.4px) 0 0/16px 16px,
                linear-gradient(180deg, #11493C 0%, #0E3B32 55%, #0B3029 100%);
    padding: 4.5rem 1.5rem 5rem;
    text-align: center;
    overflow: hidden;
  }
  .hero::after{
    content:"";
    position:absolute; inset:0;
       background: radial-gradient(ellipse at 50% 0%, rgba(120,220,195,0.12), transparent 62%);
    pointer-events:none;
  }
  .hero-inner{ position:relative; z-index:1; max-width: 720px; margin: 0 auto; }
  .hero img.logo{
    width: min(340px, 70vw);
    height: auto;
    display:block;
    margin: 0 auto 1.6rem;
    filter: drop-shadow(0 8px 24px rgba(0,0,0,0.35));
  }
  .hero .kicker{
    color: #cfe9e1;
    font-size: 0.95rem;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    margin-bottom: 0.35rem;
  }
  .hero h1{
    color: #F7F4EC;
    font-size: clamp(1.7rem, 3.4vw, 2.5rem);
    max-width: 24ch;
    margin: 0 auto 0.9rem;
  }
  .hero p{
    color: #cdd6d1;
    max-width: 48ch;
    margin: 0 auto;
    font-size: 1.02rem;
  }

  /* ---------- LAYOUT ---------- */
  .wrap{ max-width: 1160px; margin: 0 auto; padding: 0 1.5rem; }
    .app{
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 2.2rem;
    margin: 1.5rem auto 3rem;
    position: relative;
    z-index: 2;
  }
  @media (max-width: 880px){
    .app{ grid-template-columns: 1fr; margin-top: 1rem; }
  }
  .right-col{ display:flex; flex-direction:column; gap:1.4rem; }

  .card{
    background: #fff;
    border: 1px solid var(--linha);
    border-radius: 14px;
    box-shadow: 0 18px 40px -22px var(--sombra);
    padding: 1.6rem;
  }

  /* ---------- CALENDAR ---------- */
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 1rem; }
  .cal-head h2{ font-size: 1.15rem; }
  .cal-nav{ display:flex; gap: 0.4rem; }
  .cal-nav button{
    width: 30px; height:30px; border-radius: 8px; border: 1px solid var(--linha);
    background: var(--creme); color: var(--preto); font-size: 0.95rem;
  }
  .cal-nav button:hover{ background: var(--creme-2); }
  .cal-grid{ display:grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align:center; }
  .cal-grid .dow{
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em;
    color: #7a7a72; padding-bottom: 0.35rem; font-weight: 700;
  }
  .cal-day{
    position:relative; aspect-ratio: 1; display:flex; align-items:center; justify-content:center;
    border-radius: 9px; font-size: 0.86rem; color: var(--preto); background: transparent; border: 1px solid transparent;
  }
  .cal-day.pad{ visibility:hidden; }
    .cal-day.today{ border-color: var(--dourado); }
  .cal-day.disabled{ opacity: 0.35; cursor: not-allowed; }
  .cal-day.has-events{ font-weight:700; }
  .cal-day.has-events::after{
    content:""; position:absolute; bottom:4px; left:50%; transform:translateX(-50%);
    width:5px; height:5px; border-radius:50%; background: var(--verde);
  }
  .cal-day.has-pending::after{ background: var(--ambar); }
  .cal-day.selected{ background: var(--verde); color: #fff; }
  .cal-day.selected::after{ background:#fff; }
  .cal-day:not(.pad):hover{ background: var(--creme-2); }

  .selected-date-label{
    margin-top: 1.1rem; padding-top: 1rem; border-top: 1px solid var(--linha);
    font-size: 0.9rem; color: #55554d;
  }
  .selected-date-label strong{ color: var(--preto); display:block; font-family:'Fraunces',serif; font-size:1.05rem; margin-top: 0.1rem;}

  /* ---------- FORM ---------- */
  .form-card h2{ font-size: 1.15rem; margin-bottom: 0.2rem; }
  .form-card .sub{ color:#6d6d63; font-size:0.88rem; margin-bottom:1.2rem; }
  .field{ margin-bottom: 1rem; }
  .field label{ display:block; font-size: 0.78rem; font-weight:700; color:#4a4a42; margin-bottom:0.35rem; }
  .field input, .field select, .field textarea{
    width:100%; padding: 0.6rem 0.7rem; border-radius: 8px; border: 1px solid var(--linha);
    background: var(--creme); font-family: inherit; font-size: 0.92rem; color: var(--preto);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline: 2px solid var(--verde); outline-offset: 1px; background:#fff;
  }
  .row2{ display:grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
  .field textarea{ resize: vertical; min-height: 64px; }
  .field select option:disabled{ color: #b7b3a6; }

  .btn-primary{
    width:100%; padding: 0.75rem 1rem; background: var(--verde); color:#fff; border:none;
    border-radius: 9px; font-weight: 700; font-size: 0.95rem; transition: background 0.15s ease;
  }
  .btn-primary:hover{ background: var(--verde-escuro); }
  .btn-primary:disabled{ opacity:0.6; cursor:not-allowed; }

  .msg{ margin-top: 0.8rem; padding: 0.6rem 0.8rem; border-radius: 8px; font-size: 0.85rem; display:none; }
  .msg.show{ display:block; }
  .msg.ok{ background: #E5F2ED; color: var(--verde-escuro); }
  .msg.err{ background: #F7E7E3; color: var(--vermelho); }

  /* ---------- BADGES ---------- */
  .badge{
    font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 0.18rem 0.5rem; border-radius: 999px; white-space: nowrap;
  }
  .badge.pendente{ background: var(--ambar-bg); color: var(--ambar); }
  .badge.confirmado{ background: #E5F2ED; color: var(--verde-escuro); }
  .badge.recusado{ background: #F7E7E3; color: var(--vermelho); }

  /* ---------- PENDING PANEL ---------- */
  .pending-card .head-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:0.6rem; }
  .pending-card h2{ font-size: 1.15rem; }
  .pending-card .sub{ color:#6d6d63; font-size:0.88rem; margin-bottom:1.2rem; }
  .refresh-btn{
    border:1px solid var(--linha); background:var(--creme); color:#4a4a42; border-radius:8px;
    padding: 0.35rem 0.65rem; font-size: 0.78rem; font-weight:700; white-space:nowrap;
  }
  .refresh-btn:hover{ background: var(--creme-2); }
  .pending-list{ display:flex; flex-direction:column; gap: 0.8rem; }
  .pending-item{ border: 1px solid var(--linha); border-radius: 10px; padding: 0.9rem 1rem; background: var(--ambar-bg); }
  .pending-item .top{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 0.5rem; gap: 0.6rem; }
  .pending-item .datahora{ font-family:'Fraunces',serif; font-weight:600; font-size: 0.98rem; }
  .pending-item .details{ font-size: 0.85rem; color:#4a4a42; }
  .pending-item .details div{ margin-bottom: 0.15rem; }
  .pending-item .details b{ font-weight:700; }
  .pending-actions{ display:flex; gap: 0.5rem; margin-top: 0.7rem; }
  .btn-confirm, .btn-reject, .btn-ghost{
    flex:1; padding: 0.5rem 0.7rem; border-radius: 8px; font-size: 0.82rem; font-weight:700; border:none;
  }
  .btn-confirm{ background: var(--verde); color:#fff; }
  .btn-confirm:hover{ background: var(--verde-escuro); }
  .btn-reject{ background:#fff; color: var(--vermelho); border:1px solid var(--vermelho); }
  .btn-reject:hover{ background: #F7E7E3; }
  .btn-ghost{ background:#fff; color:#6d6d63; border:1px solid var(--linha); }
  .reject-box{ margin-top: 0.7rem; display:none; }
  .reject-box.show{ display:block; }
  .reject-box textarea{
    width:100%; border-radius:8px; border:1px solid var(--linha); padding:0.5rem 0.6rem;
    font-family:inherit; font-size:0.85rem; min-height:52px; margin-bottom:0.5rem;
  }
  .no-pending{ text-align:center; padding: 1.4rem 1rem; color:#8a8a80; font-size:0.88rem; }

  /* ---------- AGENDA LIST ---------- */
  .agenda-card h2{ font-size: 1.15rem; }
  .agenda-card .sub{ color:#6d6d63; font-size:0.88rem; margin-bottom:1.3rem; }
  .agenda-list{ display:flex; flex-direction:column; gap:0.7rem; }
  .slot{
    display:flex; align-items:flex-start; gap: 0.9rem; padding: 0.85rem 0.95rem;
    border: 1px solid var(--linha); border-radius: 10px; background: var(--creme);
  }
  .slot.is-recusado{ opacity: 0.6; }
  .slot .time{ font-family:'Fraunces',serif; font-weight:600; font-size: 1.02rem; color: var(--verde-escuro); min-width: 56px; }
  .slot .info{ flex:1; }
  .slot .info .top-row{ display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap; margin-bottom:0.15rem;}
  .slot .info .fornecedor{ font-weight:700; font-size:0.95rem; }
  .slot .info .produto{ font-size:0.86rem; color:#5c5c54; margin-top:0.1rem; }
  .slot .info .meta{ font-size:0.78rem; color:#8a8a80; margin-top:0.25rem; }
  .slot .info .meta span{ margin-right: 0.7rem; }
  .slot .info .obs{ font-size:0.8rem; color:#8a8a80; margin-top:0.2rem; font-style:italic; }
  .slot .del{ border:none; background:none; color:#b0aca0; font-size:1.1rem; line-height:1; padding: 0.2rem; }
  .slot .del:hover{ color: var(--vermelho); }
  .empty{ text-align:center; padding: 2.2rem 1rem; color:#8a8a80; font-size:0.9rem; }

  /* ---------- FOOTER STRIP ---------- */
  .strip{ background: var(--verde-escuro); padding: 2.6rem 1.5rem; text-align:center; }
  .strip img{ max-width: 780px; width:100%; height:auto; border-radius: 10px; margin-bottom: 1.1rem; box-shadow: 0 20px 40px -20px rgba(0,0,0,0.5); }
  .strip p{ color:#cfe9e1; font-size: 0.85rem; max-width: 46ch; margin: 0 auto; }
  footer{ text-align:center; padding: 1.4rem; font-size: 0.78rem; color:#9a9a90; }

  .auth-card{ max-width: 420px; margin: -2.75rem auto 3rem; position:relative; z-index:10; }
  .auth-tabs{ display:flex; gap:0.4rem; margin-bottom:1.3rem; }
  .auth-tab{
    flex:1; padding:0.55rem; border-radius:8px; border:1px solid var(--linha);
    background:var(--creme); color:#6d6d63; font-weight:700; font-size:0.85rem;
  }
  .auth-tab.active{ background:var(--verde); color:#fff; border-color:var(--verde); }
  .auth-form.hidden{ display:none; }
    .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:0.75rem;
    max-width:1160px; margin: -3.4rem auto 1.5rem; padding: 0.8rem 1.1rem;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 12px;
    position:relative; z-index:5; font-size:0.85rem; color:#e7efe9;
  }
  .topbar .user-info{ flex:1; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .topbar b{ color:#fff; }
  .topbar button{
    flex-shrink:0;
    background:rgba(255,255,255,0.12); color:#fff; border:1px solid rgba(255,255,255,0.3);
    border-radius:8px; padding:0.35rem 0.8rem; font-size:0.8rem; font-weight:700;
  }
  .topbar button:hover{ background:rgba(255,255,255,0.22); }
  .change-note{
    margin-top:0.4rem; padding:0.5rem 0.65rem; border-radius:8px;
    background:#FBF0DD; color:var(--ambar); font-size:0.78rem; font-weight:700;
  }
  .slot.is-new{ box-shadow: 0 0 0 2px var(--ambar) inset; }
</style>
</head>

<script>
(function(){
  /* =======================================================
     CONFIGURAÇÃO DO BANCO DE DADOS (Supabase)
     Troque os dois valores abaixo pelos dados do SEU projeto:
     Project Settings > API > Project URL / anon public key
  ========================================================== */
  const SUPABASE_URL = 'https://wzoaupmfqjbpdikcceal.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_AEr45QA_l1I2Fbq0d5WFOg_I_LYewQG';
  /* ======================================================= */

  const configured = !SUPABASE_URL.startsWith('COLE_AQUI') && !SUPABASE_ANON_KEY.startsWith('COLE_AQUI');
  if(!configured){
    document.getElementById('config-warning').classList.add('show');
  }
  const db = configured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

  const HORARIOS = [
  '09:00',
  '09:40',
  '10:20',
  '11:00',
  '11:40',
  '13:30',
];

  const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const DOWS = ['D','S','T','Q','Q','S','S'];
  const STATUS_LABEL = { pendente:'Pendente', confirmado:'Confirmado', recusado:'Recusado' };

  let currentUser = null;
  let currentProfile = null;
  let minhasSolicitacoes = [];
  let ocupados = []; // {data, horario, status} de todo mundo, sem dados sensíveis
  let viewYear, viewMonth;
  function toISODateAmanha(){
  const d = new Date();
  d.setDate(d.getDate()+1);
  return toISODate(d);
}
let selectedDate = toISODateAmanha();

  function toISODate(d){
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function formatLongDate(iso){
    const [y,m,d] = iso.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    const dias = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
    return dias[dt.getDay()] + ', ' + d + ' de ' + MESES[m-1] + ' de ' + y;
  }
  function formatShortDate(iso){
    const [y,m,d] = iso.split('-').map(Number);
    return String(d).padStart(2,'0')+'/'+String(m).padStart(2,'0');
  }

  /* ---------- AUTENTICAÇÃO ---------- */
  document.querySelectorAll('.auth-tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      document.querySelectorAll('.auth-tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      const isEntrar = tab.dataset.tab === 'entrar';
      document.getElementById('form-entrar').classList.toggle('hidden', !isEntrar);
      document.getElementById('form-cadastro').classList.toggle('hidden', isEntrar);
    });
  });

  document.getElementById('form-entrar').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const msg = document.getElementById('entrar-msg');
    const email = document.getElementById('entrar-email').value.trim();
    const senha = document.getElementById('entrar-senha').value;
    const { error } = await db.auth.signInWithPassword({ email, password: senha });
    if(error){
      msg.textContent = 'Não foi possível entrar: ' + (error.message.includes('Invalid') ? 'e-mail ou senha incorretos.' : error.message);
      msg.className = 'msg show err';
    }
  });

  document.getElementById('form-cadastro').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const msg = document.getElementById('cadastro-msg');
    const nome = document.getElementById('cad-nome').value.trim();
    const empresa = document.getElementById('cad-empresa').value.trim();
    const email = document.getElementById('cad-email').value.trim();
    const senha = document.getElementById('cad-senha').value;
    const { data, error } = await db.auth.signUp({ email, password: senha });
    if(error){
      msg.textContent = 'Não foi possível criar a conta: ' + error.message;
      msg.className = 'msg show err';
      return;
    }
    if(data.user){
      await db.from('profiles').update({ nome, empresa }).eq('id', data.user.id);
    }
    if(data.session){
      msg.textContent = 'Conta criada! Entrando...';
    }else{
      msg.textContent = 'Conta criada! Verifique seu e-mail para confirmar antes de entrar (se a confirmação estiver ativada).';
    }
    msg.className = 'msg show ok';
  });

  document.getElementById('btn-logout').addEventListener('click', async ()=>{
    await db.auth.signOut();
  });

  async function afterLogin(user){
    currentUser = user;
    let { data: profile } = await db.from('profiles').select('*').eq('id', user.id).maybeSingle();
    if(!profile){
      // trigger pode levar um instante; tenta de novo
      await new Promise(r=>setTimeout(r, 800));
      const retry = await db.from('profiles').select('*').eq('id', user.id).maybeSingle();
      profile = retry.data;
    }
    currentProfile = profile;
    document.getElementById('auth-card').style.display = 'none';
    document.getElementById('topbar').style.display = 'flex';
    document.getElementById('app-area').style.display = 'grid';
    document.getElementById('topbar-user').textContent = (profile && (profile.empresa || profile.nome)) || user.email;
    if(profile && profile.empresa){
      document.getElementById('f-fornecedor').value = profile.empresa;
    }
    await carregarTransportadoras();
    await carregarOcupados();
    await carregarMinhasSolicitacoes();
    renderAll();
  }

  function showAuthScreen(){
    currentUser = null;
    currentProfile = null;
    document.getElementById('auth-card').style.display = 'block';
    document.getElementById('topbar').style.display = 'none';
    document.getElementById('app-area').style.display = 'none';
  }

  /* ---------- DADOS ---------- */
  async function carregarTransportadoras(){
    const sel = document.getElementById('f-transportadora');
    const { data, error } = await db.from('transportadoras').select('nome').order('nome');
    sel.innerHTML = '';
    if(error || !data || data.length===0){
      const opt = document.createElement('option');
      opt.value = ''; opt.textContent = 'Nenhuma transportadora cadastrada';
      sel.appendChild(opt);
      return;
    }
    data.forEach(t=>{
      const opt = document.createElement('option');
      opt.value = t.nome; opt.textContent = t.nome;
      sel.appendChild(opt);
    });
  }

  async function carregarOcupados(){
    const { data, error } = await db.from('horarios_ocupados').select('*');
    ocupados = error ? [] : data;
  }

  async function carregarMinhasSolicitacoes(){
    const { data, error } = await db
      .from('agendamentos')
      .select('*')
      .eq('user_id', currentUser.id)
      .order('data', { ascending: false })
      .order('horario', { ascending: false });
    minhasSolicitacoes = error ? [] : data;
  }

  function ocupado(data, horario){
    return ocupados.some(o => o.data===data && o.horario===horario);
  }

  /* ---------- CALENDÁRIO ---------- */
  function renderHorarioOptions(){
    const sel = document.getElementById('f-horario');
    const prev = sel.value;
    sel.innerHTML = '';
    HORARIOS.forEach(h=>{
      const opt = document.createElement('option');
      opt.value = h;
      const occ = ocupado(selectedDate, h);
      opt.textContent = occ ? h+' — ocupado' : h;
      opt.disabled = occ;
      sel.appendChild(opt);
    });
    const firstFree = Array.from(sel.options).find(o=>!o.disabled);
    if(prev && !ocupado(selectedDate, prev)) sel.value = prev;
    else if(firstFree) sel.value = firstFree.value;
  }

  function renderCalendar(){
    document.getElementById('cal-title').textContent = MESES[viewMonth][0].toUpperCase()+MESES[viewMonth].slice(1) + ' ' + viewYear;
    const grid = document.getElementById('cal-grid');
    grid.innerHTML = '';
    DOWS.forEach(d=>{
      const el = document.createElement('div');
      el.className = 'dow'; el.textContent = d;
      grid.appendChild(el);
    });
    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
    const todayISO = toISODate(new Date());
    for(let i=0;i<firstDay;i++){
      const pad = document.createElement('div');
      pad.className = 'cal-day pad';
      grid.appendChild(pad);
    }
    for(let day=1; day<=daysInMonth; day++){
      const iso = viewYear+'-'+String(viewMonth+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'cal-day';
      cell.textContent = day;
      if(iso === todayISO) cell.classList.add('today');
      if(iso === selectedDate) cell.classList.add('selected');
      if(iso <= todayISO) cell.classList.add('disabled');
      const dayOcc = ocupados.filter(o=>o.data===iso);
      if(dayOcc.length){
        cell.classList.add('has-events');
        if(dayOcc.every(o=>o.status==='pendente')) cell.classList.add('has-pending');
      }
      cell.addEventListener('click', ()=>{
        selectedDate = iso;
        renderAll();
      });
      grid.appendChild(cell);
    }
  }

  function renderSelectedLabel(){
    document.getElementById('selected-date-text').textContent = formatLongDate(selectedDate);
  }

  /* ---------- MINHAS SOLICITAÇÕES ---------- */
  function renderMinhas(){
    const list = document.getElementById('minhas-list');
    list.innerHTML = '';

    // filtra só as solicitações do dia selecionado no calendário
    const doDia = minhasSolicitacoes.filter(item => item.data === selectedDate);

    if(doDia.length===0){
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Nenhuma solicitação sua para ' + formatShortDate(selectedDate) + '.';
      list.appendChild(empty);
      return;
    }
    const paraMarcarVistas = [];
    doDia.forEach(item=>{
      const isNew = item.alterado_pelo_deposito && !item.visto_pelo_solicitante;
      const slot = document.createElement('div');
      slot.className = 'slot' + (item.status==='recusado' ? ' is-recusado' : '') + (isNew ? ' is-new' : '');
      slot.innerHTML =
        '<div class="time">'+item.horario+'</div>'+
        '<div class="info">'+
          '<div class="top-row"><span class="fornecedor"></span><span class="badge"></span></div>'+
          '<div class="produto"></div>'+
          '<div class="meta"><span class="data-longa"></span><span class="nf"></span><span class="transp"></span><span class="qtd"></span></div>'+
          (item.observacoes ? '<div class="obs"></div>' : '')+
          (isNew ? '<div class="change-note"></div>' : '')+
        '</div>';
      slot.querySelector('.fornecedor').textContent = item.fornecedor;
      const badge = slot.querySelector('.badge');
      badge.textContent = STATUS_LABEL[item.status];
      badge.classList.add('badge', item.status);
      slot.querySelector('.produto').textContent = item.produto;
      slot.querySelector('.data-longa').textContent = formatShortDate(item.data);
      slot.querySelector('.nf').textContent = 'NF ' + item.nf;
      slot.querySelector('.transp').textContent = item.transportadora;
      if(item.quantidade) slot.querySelector('.qtd').textContent = item.quantidade;
      if(item.observacoes) slot.querySelector('.obs').textContent = item.observacoes;
      if(isNew){
        slot.querySelector('.change-note').textContent =
          'Recebimento reagendado pelo depósito. Novo horário: ' + formatShortDate(item.data) + ' às ' + item.horario + '.';
        paraMarcarVistas.push(item.id);
      }
      list.appendChild(slot);
    });
    paraMarcarVistas.forEach(id=> db.rpc('marcar_visto', { p_id: id }) );
}

  function renderAll(){
    renderCalendar();
    renderSelectedLabel();
    renderHorarioOptions();
    document.getElementById('minhas-sub-data').textContent = formatLongDate(selectedDate);
    renderMinhas();
}

  document.getElementById('cal-prev').addEventListener('click', ()=>{
    viewMonth--; if(viewMonth<0){ viewMonth=11; viewYear--; }
    renderCalendar();
  });
  document.getElementById('cal-next').addEventListener('click', ()=>{
    viewMonth++; if(viewMonth>11){ viewMonth=0; viewYear++; }
    renderCalendar();
  });

  document.getElementById('agenda-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fornecedor = document.getElementById('f-fornecedor').value.trim();
    const transportadora = document.getElementById('f-transportadora').value;
    const produto = document.getElementById('f-produto').value.trim();
    const nf = document.getElementById('f-nf').value.trim();
    const horario = document.getElementById('f-horario').value;
    const quantidade = document.getElementById('f-quantidade').value.trim();
    const observacoes = document.getElementById('f-obs').value.trim();
    const msg = document.getElementById('form-msg');
    const btn = document.getElementById('btn-enviar');

        if(selectedDate <= toISODate(new Date())){
      msg.textContent = 'Não é possível solicitar para hoje. Escolha uma data a partir de amanhã.';
      msg.className = 'msg show err';
      return;
    }

    btn.disabled = true;
    await carregarOcupados();

    if(ocupado(selectedDate, horario)){
      msg.textContent = 'Esse horário acabou de ficar ocupado em '+formatLongDate(selectedDate)+'. Escolha outro.';
      msg.className = 'msg show err';
      renderAll();
      btn.disabled = false;
      return;
    }

    const { error } = await db.from('agendamentos').insert([{
      user_id: currentUser.id,
      data: selectedDate, horario,
      data_solicitada: selectedDate, horario_solicitado: horario,
      fornecedor, transportadora, produto, nf, quantidade, observacoes,
      status: 'pendente'
    }]);
    btn.disabled = false;
    if(error){
      msg.textContent = 'Não foi possível enviar a solicitação. Tente novamente em instantes.';
      msg.className = 'msg show err';
      return;
    }

    msg.textContent = 'Solicitação enviada para '+formatLongDate(selectedDate)+' às '+horario+'. Aguardando confirmação do depósito.';
    msg.className = 'msg show ok';
    document.getElementById('f-produto').value = '';
    document.getElementById('f-nf').value = '';
    document.getElementById('f-quantidade').value = '';
    document.getElementById('f-obs').value = '';
    await carregarOcupados();
    await carregarMinhasSolicitacoes();
    renderAll();
  });

  document.addEventListener('visibilitychange', async ()=>{
    if(document.visibilityState === 'visible' && currentUser){
      await carregarOcupados();
      await carregarMinhasSolicitacoes();
      renderAll();
    }
  });

  async function init(){
    const now = new Date();
    viewYear = now.getFullYear();
    viewMonth = now.getMonth();
    if(!configured) return;
    const { data: { session } } = await db.auth.getSession();
    if(session) await afterLogin(session.user); else showAuthScreen();
    db.auth.onAuthStateChange(async (event, session)=>{
      if(session && session.user.id !== (currentUser && currentUser.id)) await afterLogin(session.user);
      else if(!session) showAuthScreen();
    });
    if(session){
      setInterval(async ()=>{
        await carregarOcupados();
        await carregarMinhasSolicitacoes();
        renderAll();
      }, 20000);
    }
  }
  init();
})();
</script>
</body>
</html>
